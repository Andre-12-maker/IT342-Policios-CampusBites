server.port=8080
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:campusbites}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.currency=${STRIPE_CURRENCY:php}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:disabled}
cloudinary.api-key=${CLOUDINARY_API_KEY:disabled}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:disabled}
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging.level.com.campusbites=DEBUG